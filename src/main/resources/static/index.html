<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Hospital Management System</title>
  <link rel="icon" type="image/svg+xml" href="images/logo.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page-body">

  <div class="auth-card">
    <div style="position: absolute; top: 16px; right: 16px;">
      <button type="button" id="btn-theme-toggle" class="btn-theme-toggle" aria-label="Toggle dark/light theme" title="Toggle Theme" onclick="UI.toggleTheme()">
        <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>
    </div>
    <div class="auth-header">
      <div class="auth-logo">
        <img src="images/logo.svg" alt="Hospital Management Logo" class="auth-logo-img">
      </div>
      <h1 class="auth-title">Hospital Management</h1>
      <p class="auth-subtitle">Clinical Operations & Patient Management</p>
    </div>

    <!-- Alert / Expiry Notification Banner -->
    <div id="auth-alert-banner" class="banner banner-warning" style="display: none;">
      <span id="auth-alert-text"></span>
    </div>

    <!-- General Error Banner -->
    <div id="login-error-banner" class="banner banner-danger" style="display: none;">
      <span id="login-error-text"></span>
    </div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="username" class="form-label">Username <span class="required-mark">*</span></label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          class="form-control" 
          placeholder="Enter your username" 
          required 
          autocomplete="username" 
          autofocus
        >
        <div id="username-error" class="form-error">Username is required</div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password <span class="required-mark">*</span></label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form-control" 
          placeholder="••••••••" 
          required 
          autocomplete="current-password"
        >
        <div id="password-error" class="form-error">Password is required</div>
      </div>

      <button type="submit" id="btn-login-submit" class="btn btn-primary" style="width: 100%; margin-top: 8px; padding: 10px;">
        Sign In
      </button>
    </form>

    <div class="auth-footer">
      <span>New patient?</span>
      <a href="signup.html" style="font-weight: 500; margin-left: 4px;">Create a patient account</a>
    </div>

    <div class="auth-staff-note">
      <svg style="width: 14px; height: 14px; flex-shrink: 0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
      <span>Doctors and administrators sign in here too, using the credentials issued by the hospital administrator — there's nothing separate to set up.</span>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script>
    // Redirect to dashboard if session token already active
    Auth.redirectIfAuthenticated();

    // Check URL parameters for session state notices
    const urlParams = new URLSearchParams(window.location.search);
    const alertBanner = document.getElementById('auth-alert-banner');
    const alertText = document.getElementById('auth-alert-text');

    if (urlParams.get('session') === 'expired') {
      alertText.textContent = 'Your session has expired — please log in again.';
      alertBanner.style.display = 'flex';
    } else if (urlParams.get('registered') === 'true') {
      alertBanner.className = 'banner banner-info';
      alertText.textContent = 'Registration successful! You can now sign in.';
      alertBanner.style.display = 'flex';
    }

    const form = document.getElementById('login-form');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('btn-login-submit');
    const errorBanner = document.getElementById('login-error-banner');
    const errorText = document.getElementById('login-error-text');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBanner.style.display = 'none';

      let hasError = false;
      if (!usernameInput.value.trim()) {
        document.getElementById('username-error').classList.add('is-visible');
        usernameInput.classList.add('is-invalid');
        hasError = true;
      } else {
        document.getElementById('username-error').classList.remove('is-visible');
        usernameInput.classList.remove('is-invalid');
      }

      if (!passwordInput.value) {
        document.getElementById('password-error').classList.add('is-visible');
        passwordInput.classList.add('is-invalid');
        hasError = true;
      } else {
        document.getElementById('password-error').classList.remove('is-visible');
        passwordInput.classList.remove('is-invalid');
      }

      if (hasError) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Authenticating...';

      try {
        await Auth.login(usernameInput.value, passwordInput.value);
        window.location.href = 'dashboard.html';
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';

        // Display user-friendly message (§4 quirk: 404 mapped to invalid credentials)
        errorText.textContent = err.message || 'Unable to sign in. Please verify your credentials.';
        errorBanner.style.display = 'flex';
        passwordInput.focus();
      }
    });
  </script>
</body>
</html>
